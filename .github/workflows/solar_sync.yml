name: Daily Sudan Solar & Starlink Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install requests beautifulsoup4

      - name: Run offline unit tests
        run: python -m unittest discover -s scripts

      - name: Run Sudan Solar & Starlink live sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SOLAR_SOURCE_URL: ${{ secrets.SOLAR_SOURCE_URL }}
          FX_SOURCE_URL: ${{ secrets.FX_SOURCE_URL }}
        run: |
          python scripts/solar_sync.py
          python scripts/scrape_live_listings.py
